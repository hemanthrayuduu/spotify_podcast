[build]
  base = "frontend"
  command = "npm ci --no-audit && npm run build"
  publish = "dist"
  # Skip the build when nothing under frontend/ changed (e.g. backend-only
  # commits), so those deploys are marked "skipped" instead of failing with
  # "Canceled build due to no content change". Exit 0 = skip, non-zero = build.
  # On the first deploy CACHED_COMMIT_REF is empty and git errors non-zero,
  # so the build still runs.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  # Node 20 reached end-of-life in April 2026; build on the current LTS.
  NODE_VERSION = "24"

# Handle SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
