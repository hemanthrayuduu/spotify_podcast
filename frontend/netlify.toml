[build]
  base = "frontend"
  command = "npm ci --no-audit && npm run build"
  publish = "dist"
  # Skip preview/branch builds when nothing under frontend/ changed. Exit 0 =
  # skip, non-zero = build. Production always builds: CACHED_COMMIT_REF is
  # shared with deploy previews, so after a PR preview built the same
  # frontend/ tree the merge to main looked unchanged and production was
  # never rebuilt. An empty ref (first deploy, cache reset) also builds,
  # because `git diff --quiet $COMMIT_REF -- .` alone always looks clean.
  ignore = 'test "$CONTEXT" != "production" && [ -n "$CACHED_COMMIT_REF" ] && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- .'

[build.environment]
  # Node 20 reached end-of-life in April 2026; build on the current LTS.
  NODE_VERSION = "24"

# Handle SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
