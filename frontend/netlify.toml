[build]
  base = "frontend"
  command = "npm ci --no-audit && npm run build"
  publish = "dist"
  # Skip the build when nothing under frontend/ changed (backend-only
  # commits). Exit 0 = skip, non-zero = build. When CACHED_COMMIT_REF is empty
  # (first deploy, or after a cache reset) an unguarded `git diff --quiet
  # $COMMIT_REF -- .` compares the commit with its own checkout, finds nothing
  # and skips the build, so require the ref and build when it's missing.
  ignore = '[ -n "$CACHED_COMMIT_REF" ] && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- .'

[build.environment]
  # Node 20 reached end-of-life in April 2026; build on the current LTS.
  NODE_VERSION = "24"

# Handle SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
