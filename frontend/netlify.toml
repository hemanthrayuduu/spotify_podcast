[build]
  base = "frontend"
  # npm install (not npm ci): react-scripts 5 resolves a typescript version its
  # own peer range rejects, so npm ci refuses the lockfile. npm install tolerates
  # it and reconciles the lockfile during the build.
  command = "npm install --no-audit && CI=false npm run build"
  publish = "build"
  # Skip the build when nothing under frontend/ changed (e.g. backend-only
  # commits), so those deploys are marked "skipped" instead of failing with
  # "Canceled build due to no content change". Exit 0 = skip, non-zero = build.
  # On the first deploy CACHED_COMMIT_REF is empty and git errors non-zero,
  # so the build still runs.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  # Node 16 is end-of-life; build on a currently supported LTS.
  NODE_VERSION = "20"
  CI = "false"

# Handle SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
