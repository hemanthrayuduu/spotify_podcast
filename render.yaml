# Render blueprint for the backend API.
# Apply via Render → Blueprints (New Blueprint Instance) pointing at this repo,
# or use it as the reference for the existing service's settings.
services:
  - type: web
    name: spotify-podcast-recommender
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # Rate limiting keys on the client IP Render appends to X-Forwarded-For
    # (app/core/limiter.py), so no --proxy-headers here.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # pandas / numpy ship 3.11 wheels; keep Render on 3.11.
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Secret — set the value in the Render dashboard (never commit it).
      - key: GROQ_API_KEY
        sync: false
      # Optional: Podcast Index language search (set in the dashboard).
      - key: PODCASTINDEX_API_KEY
        sync: false
      - key: PODCASTINDEX_API_SECRET
        sync: false
      # llama-3.3-70b-versatile was retired by Groq on 2026-08-16.
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # Lock CORS to the deployed frontend origin.
      - key: ALLOWED_ORIGINS
        value: https://spotify-podcast-recommender.netlify.app
